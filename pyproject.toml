[project]
name = "chapar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "werkzeug==3.1.8",
    "python-magic==0.4.27",
    "python-magic-bin==0.4.14; sys_platform == 'win32'",
    "gunicorn==26.2.0; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.14",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
